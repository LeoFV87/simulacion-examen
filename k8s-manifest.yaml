apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  replicas: 2
  selector:
      matchLabels:
        app: webapp
  template:
    metadata:
      labels:
        # DEFECTO DEL RETO 2:
        # La etiqueta del pod es 'app: web', pero el selector del Service busca 'app: webapp'.
        # CORRECCION: Cambiar 'app: web' a 'app: webapp'.
        app: webapp
    spec:
      containers:
        - name: web
          image: simulacion:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 8080
